  <style>
    :root {
      --primary: #1e88e5;
      --bg: #f5f5f5;
      --card: #ffffff;
      --text: #333333;
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 1rem;
    }

    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 1rem 1.2rem;
      margin-bottom: 1rem;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }

    h1 {
      font-size: 1.4rem;
      text-align: center;
      margin: 1rem 0;
      color: var(--primary);
    }

    .question-text {
      font-size: 0.98rem;
      margin-bottom: 0.6rem;
      line-height: 1.4;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .option {
      border-radius: 8px;
      border: 1px solid #dddddd;
      padding: 0.5rem 0.6rem;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: #fafafa;
    }

    .option input {
      transform: scale(1.1);
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      justify-content: center;
      margin-top: 1rem;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 0.6rem 1.4rem;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-secondary {
      background: #eeeeee;
      color: #333333;
    }

    .result {
      text-align: center;
      margin-top: 0.8rem;
      font-weight: 600;
    }

    .correct {
      color: #2e7d32;
    }

    .incorrect {
      color: #c62828;
    }

    @media (max-width: 480px) {
      .card {
        padding: 0.8rem 0.9rem;
      }
      .option {
        font-size: 0.9rem;
      }
      button {
        width: 100%;
      }
    }
  </style>
</head>

    function renderQuiz() {
      const quizDiv = document.getElementById('quiz');
      quizDiv.innerHTML = '';

      questions.forEach((q, qIndex) => {
        const card = document.createElement('div');
        card.className = 'card';

        const qText = document.createElement('div');
        qText.className = 'question-text';
        qText.textContent = `${qIndex + 1}. ${q.text}`;
        card.appendChild(qText);

        const optionsDiv = document.createElement('div');
        optionsDiv.className = 'options';

        q.options.forEach((opt, optIndex) => {
          const label = document.createElement('label');
          label.className = 'option';

          const input = document.createElement('input');
          input.type = 'radio';
          input.name = `q${qIndex}`;
          input.value = optIndex;

          label.appendChild(input);
          const span = document.createElement('span');
          span.textContent = opt;
          label.appendChild(span);

          optionsDiv.appendChild(label);
        });

        card.appendChild(optionsDiv);
        quizDiv.appendChild(card);
      });
    }

    function submitQuiz() {
      let score = 0;
      let unanswered = 0;

      questions.forEach((q, qIndex) => {
        const selected = document.querySelector(`input[name="q${qIndex}"]:checked`);
        if (!selected) {
          unanswered++;
          return;
        }
        const answerIndex = parseInt(selected.value, 10);
        if (answerIndex === q.correctIndex) {
          score++;
        }
      });

      const resultDiv = document.getElementById('result');
      if (unanswered > 0) {
        resultDiv.innerHTML =
          `<span class="incorrect">You left ${unanswered} question(s) unanswered.</span><br>` +
          `Score: ${score} / ${questions.length}`;
      } else {
        resultDiv.innerHTML =
          `<span class="correct">You scored ${score} out of ${questions.length}.</span>`;
      }
    }

    function resetQuiz() {
      document.getElementById('result').textContent = '';
      renderQuiz();
    }

    // Initial render
    renderQuiz();
